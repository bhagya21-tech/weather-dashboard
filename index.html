<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <main class="weather-app">

        <header class="app-header">

            <h1>Weather Dashboard</h1>

            <p>Get real-time weather information for any city</p>

        </header>

        <section class="search-section">

            <form id="search-form" class="search-form">

                <input
                    type="text"
                    id="city-input"
                    placeholder="Enter city name..."
                    autocomplete="off"
                >

                <button type="submit" id="search-button">
                    Search
                </button>

            </form>

            <div class="unit-toggle">

                <button
                   type="button"
                   id="celsius-button"
                   class="unit-button active"
                >
                   °C
                </button>

                <button
                    type="button"
                    id="fahrenheit-button"
                    class="unit-button"
                >
                    °F
                </button>

            </div>

        </section>


        <section id="weather-container" class="weather-container">

            <div class="weather-placeholder">

                <h2>Search for a city</h2>

                <p>
                    Enter a city name above to see current weather information.
                </p>

            </div>

        </section>


        <div id="loading" class="loading hidden">

            <p>Loading weather data...</p>

        </div>


        <div id="error-message" class="error-message hidden">

            <p id="error-text"></p>

        </div>

    </main>


    <!-- JavaScript files -->

    <script src="js/config.js"></script>

    <script src="js/api.js"></script>

    <script src="js/ui.js"></script>

    <script src="js/app.js"></script>

</body>

</html>
